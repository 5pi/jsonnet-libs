$extends: ../../base/deployment.yaml
metadata:
  name: plex
  namespace: default
spec:
  selector:
    matchLabels:
      name: plex
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        name: plex
    spec:
      hostNetwork: true
      hostname: plex
      containers:
      - name: plex
        image: plexinc/pms-docker:1.41.7.9823-59f304c16
        env:
        - name: PLEX_CLAIM
          value: foo
        - name: TZ
          value: Europe/Berlin
        - name: ADVERTISE_IP
          value: http://plex.example.com:32400/
        ports:
        - containerPort: 32469
        - containerPort: 1900
          protocol: UDP
        - containerPort: 32410
          protocol: UDP
        - containerPort: 32411
          protocol: UDP
        - containerPort: 32412
          protocol: UDP
        - containerPort: 32413
          protocol: UDP
        - containerPort: 3005
        - containerPort: 8324
        volumeMounts:
        - name: plex
          mountPath: /config
        - name: media
          mountPath: /data
        - name: transcode
          mountPath: /transcode
      volumes:
      - name: plex
        persistentVolumeClaim:
          claimName: plex
      - name: media
        hostPath:
          path: /pool-mirror/media
      - name: transcode
        emptyDir: {}
