$extends: ../../base/ingress.yaml
metadata:
  name: nzbget
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 500m
spec:
  rules:
  - host: nzbget.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nzbget
            port:
              number: 6789
