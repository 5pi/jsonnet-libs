$extends: ../../base/deployment.yaml
metadata:
  name: nzbget
  namespace: media
spec:
  selector:
    matchLabels:
      name: nzbget
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        name: nzbget
    spec:
      nodeSelector: {}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
      - name: nzbget
        image: fish/nzbget:v21.1
        args:
        - -s
        - --configfile=/etc/nzbget/nzbget.conf
        volumeMounts:
        - name: nzbget
          mountPath: /nzbget/downloads
        - name: media
          mountPath: /media
        - name: cacerts
          mountPath: /etc/ssl/certs/ca-certificates.crt
        - name: config
          mountPath: /etc/nzbget
      volumes:
      - name: nzbget
        persistentVolumeClaim:
          claimName: nzbget
      - name: media
        hostPath:
          path: /pool-mirror/media
      - name: cacerts
        hostPath:
          path: /etc/ssl/certs/ca-certificates.crt
      - name: config
        configMap:
          name: nzbget-config
