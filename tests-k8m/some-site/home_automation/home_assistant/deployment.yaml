apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      name: home-assistant
  template:
    metadata:
      labels:
        name: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: rpi-living
      containers:
        - name: home-assistant
          image: homeassistant/home-assistant:2026.4.0
          command:
            - python3
            - -m
            - homeassistant
            - --config
            - /config
          livenessProbe:
            httpGet:
              port: 8123
            initialDelaySeconds: 600
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          hostPath:
            path: /data/home-assistant
