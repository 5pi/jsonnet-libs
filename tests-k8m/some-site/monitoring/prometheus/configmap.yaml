ter_quantile:scheduler_scheduling_algorithm_duration_seconds:histogram_quantile\"\n  - \"expr\": |\n      histogram_quantile(0.5, sum(rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{job=\"kube-scheduler\"}[5m])) without(instance, pod))\n    \"labels\":\n      \"quantile\": \"0.5\"\n    \"record\": \"cluster_quantile:scheduler_pod_scheduling_sli_duration_seconds:histogram_quantile\"\n- \"name\": \"node.rules\"\n  \"rules\":\n  - \"expr\": |\n      topk by(cluster, namespace, pod) (1,\n        max by (cluster, node, namespace, pod) (\n          label_replace(kube_pod_info{job=\"kube-state-metrics\",node!=\"\"}, \"pod\", \"$1\", \"pod\", \"(.*)\")\n      ))\n    \"record\": \"node_namespace_pod:kube_pod_info:\"\n  - \"expr\": |\n      count by (cluster, node) (\n        node_cpu_seconds_total{mode=\"idle\",job=\"node-exporter\"}\n        * on (cluster, namespace, pod) group_left(node)\n        topk by(cluster, namespace, pod) (1, node_namespace_pod:kube_pod_info:)\n      )\n    \"record\": \"node:node_num_cpu:sum\"\n  - \"expr\": |\n      sum(\n        node_memory_MemAvailable_bytes{job=\"node-exporter\"} or\n        (\n          node_memory_Buffers_bytes{job=\"node-exporter\"} +\n          node_memory_Cached_bytes{job=\"node-exporter\"} +\n          node_memory_MemFree_bytes{job=\"node-exporter\"} +\n          node_memory_Slab_bytes{job=\"node-exporter\"}\n        )\n      ) by (cluster)\n    \"record\": \":node_memory_MemAvailable_bytes:sum\"\n  - \"expr\": |\n      avg by (cluster, node) (\n        sum without (mode) (\n          rate(node_cpu_seconds_total{mode!=\"idle\",mode!=\"iowait\",mode!=\"steal\",job=\"node-exporter\"}[5m])\n        )\n      )\n    \"record\": \"node:node_cpu_utilization:ratio_rate5m\"\n  - \"expr\": |\n      avg by (cluster) (\n        node:node_cpu_utilization:ratio_rate5m\n      )\n    \"record\": \"cluster:node_cpu:ratio_rate5m\"\n- \"name\": \"kubelet.rules\"\n  \"rules\":\n  - \"expr\": |\n      histogram_quantile(\n        0