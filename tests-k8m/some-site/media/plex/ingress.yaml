apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex
  namespace: default
spec:
  rules:
    - host: plex.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plex
                port:
                  number: 32400
