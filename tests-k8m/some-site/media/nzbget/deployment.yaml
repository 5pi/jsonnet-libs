apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nzbget
  template:
    metadata:
      labels:
        name: nzbget
    spec:
      nodeSelector: {}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
      containers:
        - name: nzbget
          image: fish/nzbget:v21.1
          args:
            - -s
            - --configfile=/etc/nzbget/nzbget.conf
          volumeMounts:
            - name: nzbget
              mountPath: /nzbget/downloads
            - name: media
              mountPath: /media
            - name: cacerts
              mountPath: /etc/ssl/certs/ca-certificates.crt
            - name: config
              mountPath: /etc/nzbget
      volumes:
        - name: nzbget
          persistentVolumeClaim:
            claimName: nzbget
        - name: media
          hostPath:
            path: /pool-mirror/media
        - name: cacerts
          hostPath:
            path: /etc/ssl/certs/ca-certificates.crt
        - name: config
          configMap:
            name: nzbget-config
  strategy:
    type: Recreate
